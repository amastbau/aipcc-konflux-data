apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: copy-clair-scan-results
spec:
  description: Copy Clair report OCI artifacts for the released component to its Quay repository.
  params:
    - name: release
      type: string
    - name: snapshot
      type: string
    - name: target-repo
      type: string
      default: ""
      description: Optional legacy override; otherwise derive the target repository from Release artifacts.
  volumes:
    - name: pull-creds
      secret:
        secretName: components-namespace-pull
        items:
          - key: .dockerconfigjson
            path: config.json
    - name: push-creds
      secret:
        secretName: quay-aipcc-finalpipeline-push
        items:
          - key: .dockerconfigjson
            path: config.json
  steps:
    - name: copy-results
      image: quay.io/konflux-ci/release-service-utils:e633d51cd41d73e4b3310face21bb980af7a662f
      env:
        - name: RELEASE
          value: $(params.release)
        - name: SNAPSHOT
          value: $(params.snapshot)
        - name: TARGET_REPO
          value: $(params.target-repo)
      volumeMounts:
        - name: pull-creds
          mountPath: /creds/pull
          readOnly: true
        - name: push-creds
          mountPath: /creds/push
          readOnly: true
      script: |
        #!/bin/bash
        set -eo pipefail
        SNAPSHOT_DATA=$(get-resource "snapshot" "${SNAPSHOT}" "{.spec}")
        if [ -n "$TARGET_REPO" ]; then
          IMAGE=$(echo "$SNAPSHOT_DATA" | jq -r ".components[0].containerImage")
          if [ -z "$IMAGE" ] || [ "$IMAGE" = "null" ]; then
            echo "ERROR: No component image found in snapshot"
            exit 1
          fi
        else
          RELEASE_ARTIFACTS=$(get-resource "release" "${RELEASE}" "{.status.artifacts}")
          if [ "$RELEASE_ARTIFACTS" = "{}" ] || [ -z "$RELEASE_ARTIFACTS" ]; then
            echo "ERROR: No artifacts found in Release CR status"
            exit 1
          fi
          COMPONENT_NAME=$(echo "$RELEASE_ARTIFACTS" | jq -r '.images[0].name')
          TARGET_REPO=$(echo "$RELEASE_ARTIFACTS" | jq -r '.images[0].urls[0]' | cut -d: -f1)
          if [ -z "$COMPONENT_NAME" ] || [ "$COMPONENT_NAME" = "null" ] || [ -z "$TARGET_REPO" ] || [ "$TARGET_REPO" = "null" ]; then
            echo "ERROR: Could not derive released component and target repository"
            exit 1
          fi
          IMAGE=$(echo "$SNAPSHOT_DATA" | jq -r --arg name "$COMPONENT_NAME" '.components[] | select(.name == $name) | .containerImage')
          if [ -z "$IMAGE" ]; then
            echo "ERROR: Component '$COMPONENT_NAME' not found in snapshot"
            exit 1
          fi
        fi
        SOURCE_REPO="${IMAGE%%@*}"
        CLAIR_REPORT_SHAS=$(DOCKER_CONFIG=/creds/pull cosign download attestation "${IMAGE}" | jq -r '
          .payload | @base64d | fromjson |
          .predicate.buildConfig.tasks[] |
          select(.name=="clair-scan").results[] |
          select(.name=="REPORTS").value |
          fromjson | .[]')
        if [ -z "$CLAIR_REPORT_SHAS" ]; then
          echo "ERROR: No REPORTS blob found in attestation for image $IMAGE"
          exit 1
        fi
        for SHA in ${CLAIR_REPORT_SHAS}; do
          echo "Copying $SHA"
          skopeo copy --src-authfile /creds/pull/config.json --dest-authfile /creds/push/config.json \
            "docker://${SOURCE_REPO}@${SHA}" "docker://${TARGET_REPO}@${SHA}"
        done
