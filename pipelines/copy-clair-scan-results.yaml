apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: copy-clair-scan-results
spec:
  params:
    - name: release
      type: string
    - name: releasePlan
      type: string
    - name: snapshot
      type: string
    - name: target-repo
      type: string
  tasks:
    - name: copy-clair-scan-results-task
      params:
        - name: snapshot
          value: $(params.snapshot)
        - name: target-repo
          value: $(params.target-repo)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/red-hat-data-services/aipcc-konflux-data
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/copy-clair-scan-results.yaml
